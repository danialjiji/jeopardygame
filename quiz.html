<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup - Jeopardy Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Absolute centering specifically for the initial setup container */
    #setup-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      width: 100%;
      display: flex;
      justify-content: center;
      transition: opacity 0.6s var(--transition-bezier), transform 0.6s var(--transition-bezier);
    }

    #setup-container.hidden {
      opacity: 0;
      transform: translate(-50%, -60%) scale(0.9);
      pointer-events: none;
    }

    .setup-step {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .setup-step.active {
      display: flex;
      animation: setupFadeIn 0.4s var(--transition-bezier);
    }

    @keyframes setupFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #team-names-inputs-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px 12px;
      width: 100%;
      max-height: 260px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 24px;
      box-sizing: border-box;
    }

    /* Custom scrollbar for names container */
    #team-names-inputs-container::-webkit-scrollbar {
      width: 6px;
    }

    #team-names-inputs-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    #team-names-inputs-container::-webkit-scrollbar-thumb {
      background: rgba(76, 63, 61, 0.3);
      border-radius: 10px;
    }

    #team-names-inputs-container::-webkit-scrollbar-thumb:hover {
      background: rgba(76, 63, 61, 0.5);
    }

    .team-input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
    }

    .team-input-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4c3f3d;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .team-input-group .quiz-input {
      padding: 10px 16px;
      font-size: 1rem;
      text-align: left;
      border-radius: 16px;
    }

    .btn-no {
      background-color: #b5a387;
    }

    .btn-no:hover {
      background-color: #c4b296;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(181, 163, 135, 0.3);
    }

    /* Time's Up Overlay inside Modal */
    .times-up-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(141, 167, 223, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s var(--transition-bezier);
    }

    .times-up-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .times-up-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .times-up-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      color: #e26156;
      margin-bottom: 8px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
      animation: pulse-title 1.2s infinite alternate var(--transition-bezier);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @keyframes pulse-title {
      from {
        transform: scale(0.96);
      }

      to {
        transform: scale(1.04);
      }
    }

    .times-up-subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #1e1e1e;
      margin-bottom: 24px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .times-up-countdown {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(3.5rem, 10vw, 5rem);
      font-weight: 900;
      color: #ffffff;
      background: #9e1b1b;
      border: 5px solid #ffd54f;
      padding: 10px 48px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25),
        0 0 20px rgba(255, 213, 79, 0.2);
      text-shadow: 2px 2px 0px #4a0d0d;
      position: relative;
    }

    .score-team {
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s ease;
    }

    .score-pill:hover .score-team {
      border-bottom: 1px dashed rgba(255, 255, 255, 0.6);
    }

    .score-team-input {
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 2px 8px;
      width: 100px;
      outline: none;
      text-align: center;
    }

    .score-team-input:focus {
      background: rgba(255, 255, 255, 0.35);
      border-color: #ffd54f;
    }
  </style>
</head>

<body class="quiz-page">

  <!-- Ambient background glow elements -->
  <div class="glow-top-right"></div>
  <div class="glow-bottom-left"></div>


  <div class="quiz-board-header aesthetic-header-card" id="quiz-board-header" style="display: none;">
    <h2 class="section-title quiz-title">Jeopardy Quiz Board</h2>
  </div>

  <!-- Scoreboard Container -->
  <div class="scoreboard-container" id="scoreboard-container" style="display: none;">
    <div class="scoreboard" id="scoreboard"></div>
  </div>

  <!-- Quiz Header -->


  <!-- Game Board Container -->
  <div class="game-board-container" id="game-board-container" style="display: none;">
    <div class="board-sidebar">
      <div class="sidebar-label category-label">Category</div>
      <div class="sidebar-label points-label">Points</div>
    </div>
    <div class="game-grid" id="game-grid"></div>
  </div>

  <!-- Control Buttons Container -->
  <div class="control-buttons-container" id="control-buttons-container" style="display: none;">
    <button class="btn-control btn-restart" id="btn-restart">Restart Game</button>
    <button class="btn-control btn-end" id="btn-end">End Game</button>
  </div>

  <!-- Central Card (Initial Setup) -->
  <div id="setup-container">
    <div class="quiz-card" id="quiz-card">
      <div class="quiz-card-inner">

        <!-- Step 1: Group Count -->
        <div id="setup-step-1" class="setup-step active">
          <h2 class="quiz-card-title">How many groups/teams<br>will play this game?</h2>

          <div class="quiz-card-input-wrapper">
            <input type="number" min="1" max="35" placeholder="Enter number..." class="quiz-input"
              id="group-count-input" autofocus>
          </div>

          <div class="quiz-buttons">
            <a href="index.html" class="btn-quiz btn-cancel">Cancel</a>
            <button class="btn-quiz btn-enter" id="btn-enter-step1">Enter</button>
          </div>
        </div>

        <!-- Step 2: Edit Team Names -->
        <div id="setup-step-2" class="setup-step">
          <h2 class="quiz-card-title" style="margin-bottom: 12px;">Edit Team Names</h2>

          <div id="team-names-inputs-container">
            <!-- Dynamically generated inputs -->
          </div>

          <div class="quiz-buttons">
            <button class="btn-quiz btn-cancel" id="btn-names-back">Back</button>
            <button class="btn-quiz btn-enter" id="btn-names-start">Start Game</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal Backdrop for Question Details -->
  <div class="modal-backdrop" id="question-modal-backdrop">
    <div class="question-modal" id="question-modal">
      <button class="modal-close-btn" id="modal-close-btn">&times;</button>

      <!-- Section 1: Question Details -->
      <div class="modal-question-card">
        <div class="modal-timer-container">
          <div class="modal-timer" id="modal-timer">30s</div>
        </div>
        <h3 class="modal-question-title" id="modal-title">Take A Guess 🧑‍🍳</h3>
        <p class="modal-question-text" id="modal-question">Question goes here...</p>
      </div>

      <!-- Section 2: Show Answer / Answer Revealed -->
      <div class="modal-answer-container">
        <button class="btn-reveal-answer" id="btn-reveal-answer">Show The Answer!</button>
        <div class="modal-answer-text" id="modal-answer-text" style="display: none;">Answer text here</div>
      </div>

      <!-- Section 3: Winner Selection -->
      <div class="modal-winner-card">
        <h4 class="modal-winner-label">choose the winner:</h4>
        <div class="modal-winner-grid" id="modal-winner-grid">
          <!-- Dynamically populated teams list -->
        </div>
      </div>

      <!-- Time's Up Overlay -->
      <div class="times-up-overlay" id="times-up-overlay">
        <div class="times-up-content">
          <div class="times-up-title">⏰ TIME'S UP!</div>
          <div class="times-up-subtitle">Final countdown to answer:</div>
          <div class="times-up-countdown" id="times-up-countdown">10s</div>
          <button class="btn-quiz btn-cancel" id="btn-times-up-close"
            style="margin-top: 24px; min-width: 180px;">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- End Game Modal Backdrop -->
  <div class="modal-backdrop" id="end-game-modal-backdrop">
    <div class="end-game-modal" id="end-game-modal">
      <div class="end-game-header">
        <span class="trophy-emoji">🏆</span>
        <h2 class="end-game-title">Final Leaderboard</h2>
      </div>

      <!-- Sorted Leaderboard List -->
      <div class="leaderboard-list" id="leaderboard-list">
        <!-- Dynamically populated rank cards -->
      </div>

      <!-- Winner Announcement banner -->
      <div class="winner-announcement" id="winner-announcement">
        <!-- Will display: The Winner is Team X! -->
      </div>

      <!-- Exit Button -->
      <div class="exit-btn-container">
        <a href="index.html" class="btn-exit">Exit Game</a>
      </div>
    </div>
  </div>

  <!-- Load global questions dataset -->
  <script src="js/questions.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const card = document.getElementById("quiz-card");
      const setupContainer = document.getElementById("setup-container");
      const cols = 8;
      const rows = 4;

      // Top row & Bottom row for border lights
      for (let i = 0; i < cols; i++) {
        const xPercent = (i / (cols - 1)) * 100;
        createLight(xPercent, 0);
        createLight(xPercent, 100);
      }

      // Left & Right columns (excluding corners) for border lights
      for (let j = 1; j < rows - 1; j++) {
        const yPercent = (j / (rows - 1)) * 100;
        createLight(0, yPercent);
        createLight(100, yPercent);
      }

      function createLight(xPercent, yPercent) {
        const light = document.createElement("div");
        light.className = "border-light";

        let leftStyle = "";
        let topStyle = "";

        if (xPercent === 0) {
          leftStyle = "8px";
        } else if (xPercent === 100) {
          leftStyle = "calc(100% - 8px)";
        } else {
          leftStyle = `calc(8px + (100% - 16px) * ${xPercent / 100})`;
        }

        if (yPercent === 0) {
          topStyle = "8px";
        } else if (yPercent === 100) {
          topStyle = "calc(100% - 8px)";
        } else {
          topStyle = `calc(8px + (100% - 16px) * ${yPercent / 100})`;
        }

        light.style.left = leftStyle;
        light.style.top = topStyle;

        card.appendChild(light);
      }

      // Global variables to store group count, team scores, and countdown timer
      window.group = 0;
      window.teamScores = {};
      window.teamNames = {};
      let timerInterval = null;
      let secondaryInterval = null;
      let timerAudio = null;
      let bgAudio = null;
      let winnerAudio = null;

      const input = document.getElementById("group-count-input");
      const scoreboardContainer = document.getElementById("scoreboard-container");
      const scoreboard = document.getElementById("scoreboard");

      const gameBoardContainer = document.getElementById("game-board-container");
      const gameGrid = document.getElementById("game-grid");

      // Preset team names list (Famous luxury/fashion/lifestyle brands)
      const PRESET_TEAM_NAMES = [
        "Armani", "Balenciaga", "Bottega", "Burberry", "Carolina Herrera",
        "Cavalli", "Celine", "Chanel", "Dior", "DKNY", 
        "Elie Saab", "Fendi", "Ferragamo", "Gaultier", "Givenchy", 
        "Gucci", "Jimmy Choo", "Karl Lagerfeld", "Kenzo", "Loewe", 
        "Marc Jacobs", "McQueen", "Melinda Looi", "Michael Kors", "Mugler", 
        "Prada", "Ralph Lauren", "Rizalman", "Saint Laurent", "Schiaparelli", 
        "Stella McCartney", "Tom Ford", "Valentino", "Versace", "Westwood"
      ];

      // Setup button reference
      const btnEnterStep1 = document.getElementById("btn-enter-step1");
      const btnNamesBack = document.getElementById("btn-names-back");
      const btnNamesStart = document.getElementById("btn-names-start");
      const namesContainer = document.getElementById("team-names-inputs-container");

      // Modal elements
      const backdrop = document.getElementById("question-modal-backdrop");
      const modalTitle = document.getElementById("modal-title");
      const modalQuestion = document.getElementById("modal-question");
      const btnRevealAnswer = document.getElementById("btn-reveal-answer");
      const modalAnswerText = document.getElementById("modal-answer-text");
      const winnerGrid = document.getElementById("modal-winner-grid");
      const closeBtn = document.getElementById("modal-close-btn");
      const modalTimer = document.getElementById("modal-timer");

      // Open Modal handler
      function openModal(category, val, cardItem) {
        const categoryEmojis = {
          "Food": "🧑‍🍳",
          "History": "📜",
          "Fashion": "👚",
          "Place": "📍",
          "Fun Fact": "💡",
          "Movies": "🎬",
          "Sports": "🏆"
        };

        const emoji = categoryEmojis[category] || "❓";
        modalTitle.textContent = `Take A Guess ${emoji}`;

        // Find question
        const qData = jeopardyData[category]?.[val] || { q: "No question configured for this category.", a: "No answer found." };
        modalQuestion.textContent = qData.q;
        modalAnswerText.textContent = qData.a;

        // Reset answer reveal states
        modalAnswerText.style.display = "none";
        btnRevealAnswer.style.display = "block";

        // Stop background audio during countdown
        if (bgAudio) {
          bgAudio.pause();
        }

        // Reset and start 30s countdown timer
        clearInterval(timerInterval);
        if (secondaryInterval) clearInterval(secondaryInterval);
        document.getElementById("times-up-overlay").classList.remove("visible");

        let timeLeft = 30;
        modalTimer.textContent = "30s";
        modalTimer.classList.remove("warning");

        // Play countdown audio
        if (!timerAudio) {
          timerAudio = new Audio('audio/jeopardy_countdown_audio.mp3');
        }
        timerAudio.currentTime = 0;
        timerAudio.play().catch(e => console.log("Audio play blocked by browser policy until user interacts:", e));

        timerInterval = setInterval(() => {
          timeLeft--;
          modalTimer.textContent = `${timeLeft}s`;

          if (timeLeft <= 5) {
            modalTimer.classList.add("warning");
          }

          if (timeLeft <= 0) {
            clearInterval(timerInterval);

            // Stop audio when time is up
            if (timerAudio) {
              timerAudio.pause();
              timerAudio.currentTime = 0;
            }

            const timesUpOverlay = document.getElementById("times-up-overlay");
            const secondTimerEl = document.getElementById("times-up-countdown");
            timesUpOverlay.classList.add("visible");

            let secondTimerVal = 10;
            secondTimerEl.textContent = "10s";

            if (secondaryInterval) clearInterval(secondaryInterval);
            secondaryInterval = setInterval(() => {
              secondTimerVal--;
              secondTimerEl.textContent = `${secondTimerVal}s`;
              if (secondTimerVal <= 0) {
                clearInterval(secondaryInterval);
                // Do not auto-close or reveal, just stay at 0s
              }
            }, 1000);
          }
        }, 1000);

        // Build winner teams selection grid
        winnerGrid.innerHTML = "";
        for (let t = 1; t <= window.group; t++) {
          const btn = document.createElement("button");
          btn.className = "btn-winner-team";
          btn.textContent = window.teamNames[t];
          btn.addEventListener("click", () => {
            // Add points to selected team
            window.teamScores[t] += val;
            document.getElementById(`team-score-val-${t}`).textContent = window.teamScores[t];

            // Fade out point card
            cardItem.classList.add("played");
            closeModal();
          });
          winnerGrid.appendChild(btn);
        }

        // Add a "No Winner" button
        const noWinnerBtn = document.createElement("button");
        noWinnerBtn.className = "btn-winner-team btn-winner-none";
        noWinnerBtn.textContent = "No Winner";
        noWinnerBtn.addEventListener("click", () => {
          cardItem.classList.add("played");
          closeModal();
        });
        winnerGrid.appendChild(noWinnerBtn);

        backdrop.classList.add("visible");
      }

      function closeModal() {
        backdrop.classList.remove("visible");
        clearInterval(timerInterval);
        if (secondaryInterval) clearInterval(secondaryInterval);
        document.getElementById("times-up-overlay").classList.remove("visible");

        // Stop audio
        if (timerAudio) {
          timerAudio.pause();
          timerAudio.currentTime = 0;
        }

        // Resume background audio
        if (bgAudio) {
          bgAudio.play().catch(e => console.log("Background audio resume blocked:", e));
        }
      }

      // Close modal events
      closeBtn.addEventListener("click", closeModal);

      // Reveal answer event
      btnRevealAnswer.addEventListener("click", () => {
        clearInterval(timerInterval); // Stop timer on manual reveal
        if (secondaryInterval) clearInterval(secondaryInterval);
        document.getElementById("times-up-overlay").classList.remove("visible");
        btnRevealAnswer.style.display = "none";
        modalAnswerText.style.display = "block";

        // Stop audio
        if (timerAudio) {
          timerAudio.pause();
          timerAudio.currentTime = 0;
        }
      });

      function showStep(stepNum) {
        document.querySelectorAll(".setup-step").forEach(step => {
          step.classList.remove("active");
        });
        document.getElementById(`setup-step-${stepNum}`).classList.add("active");
      }

      function processGroupCount() {
        const value = parseInt(input.value, 10);
        if (isNaN(value) || value < 1 || value > 35) {
          alert("Please enter a valid number of groups (1-35).");
          return;
        }

        window.group = value;

        // Populate the team name inputs dynamically
        namesContainer.innerHTML = "";
        for (let t = 1; t <= window.group; t++) {
          const groupDiv = document.createElement("div");
          groupDiv.className = "team-input-group";
          const defaultName = PRESET_TEAM_NAMES[t - 1] || `Team ${t}`;
          groupDiv.innerHTML = `
            <label for="team-name-input-${t}">Team ${t}</label>
            <input type="text" class="quiz-input team-name" id="team-name-input-${t}" placeholder="Enter name..." value="${defaultName}">
          `;
          namesContainer.appendChild(groupDiv);
        }

        showStep(2);

        // Auto focus first team input
        setTimeout(() => {
          const firstInput = document.getElementById("team-name-input-1");
          if (firstInput) {
            firstInput.focus();
            firstInput.select();
          }
        }, 50);
      }

      function startGame() {
        window.teamNames = {};
        for (let t = 1; t <= window.group; t++) {
          const inputEl = document.getElementById(`team-name-input-${t}`);
          window.teamNames[t] = (inputEl && inputEl.value.trim()) ? inputEl.value.trim() : (PRESET_TEAM_NAMES[t - 1] || `Team ${t}`);
        }

        // Play background audio
        if (!bgAudio) {
          bgAudio = new Audio('audio/jeopardy_background_audio.mp3');
          bgAudio.loop = true;
          bgAudio.volume = 0.15; // decreased volume
        }
        bgAudio.currentTime = 0;
        bgAudio.play().catch(e => console.log("Background audio play blocked by browser policy:", e));

        // Hide setup form with CSS transition
        setupContainer.classList.add("hidden");
        setTimeout(() => {
          setupContainer.style.display = "none";
        }, 600);

        // Clear and build scoreboard based on dynamic team count
        scoreboard.innerHTML = "";
        window.teamScores = {};

        if (window.group > 12) {
          scoreboard.classList.add("compact");
        } else {
          scoreboard.classList.remove("compact");
        }

        for (let t = 1; t <= window.group; t++) {
          window.teamScores[t] = 0;
          const scorePill = document.createElement("div");
          scorePill.className = "score-pill";
          scorePill.innerHTML = `
            <span class="score-team" title="Click to edit team name">${window.teamNames[t]}</span>
            <div class="score-divider"></div>
            <span class="score-val" id="team-score-val-${t}">0</span>
            <span class="score-unit">pts</span>
          `;
          scoreboard.appendChild(scorePill);

          // Add inline editing for the team name
          const teamSpan = scorePill.querySelector(`.score-team`);
          teamSpan.addEventListener("click", () => {
            const currentName = window.teamNames[t];
            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.className = "score-team-input";
            nameInput.value = currentName;

            // Swap span with input
            teamSpan.replaceWith(nameInput);
            nameInput.focus();
            nameInput.select();

            const saveName = () => {
              const newName = nameInput.value.trim() || currentName;
              window.teamNames[t] = newName;
              teamSpan.textContent = newName;
              nameInput.replaceWith(teamSpan);
            };

            nameInput.addEventListener("blur", saveName);
            nameInput.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                saveName();
              }
            });
          });
        }

        // Generate Game Board grid (7 categories x 6 points rows)
        const categories = ["Food", "History", "Fashion", "Place", "Fun Fact", "Movies", "Sports"];
        const points = [20, 40, 70, 100, 140, 200];

        gameGrid.innerHTML = "";

        // First row: Categories header
        categories.forEach(cat => {
          const header = document.createElement("div");
          header.className = "cat-header";
          header.textContent = cat;
          gameGrid.appendChild(header);
        });

        // Rows 2-7: Point cards
        points.forEach((val, rowIndex) => {
          for (let col = 0; col < categories.length; col++) {
            const categoryName = categories[col];
            const cardItem = document.createElement("div");
            cardItem.className = `point-card row-${rowIndex + 1}`;
            cardItem.textContent = val;

            // Open question modal when clicked
            cardItem.addEventListener("click", () => {
              if (!cardItem.classList.contains("played")) {
                openModal(categoryName, val, cardItem);
              }
            });

            gameGrid.appendChild(cardItem);
          }
        });

        // 5. Display containers
        scoreboardContainer.style.display = "flex";
        quizBoardHeader.style.display = "flex";
        gameBoardContainer.style.display = "flex";
        controlButtonsContainer.style.display = "flex";

        setTimeout(() => {
          scoreboardContainer.classList.add("visible");
          quizBoardHeader.classList.add("visible");
          gameBoardContainer.classList.add("visible");
        }, 150);
      }

      // Control elements
      const quizBoardHeader = document.getElementById("quiz-board-header");
      const controlButtonsContainer = document.getElementById("control-buttons-container");
      const restartBtn = document.getElementById("btn-restart");
      const endBtn = document.getElementById("btn-end");
      const endGameBackdrop = document.getElementById("end-game-modal-backdrop");
      const leaderboardList = document.getElementById("leaderboard-list");
      const winnerAnnouncement = document.getElementById("winner-announcement");

      // Restart Game button click handler
      restartBtn.addEventListener("click", () => {
        window.location.reload();
      });

      // End Game button click handler
      endBtn.addEventListener("click", () => {
        const scoresArray = [];
        for (let t = 1; t <= window.group; t++) {
          scoresArray.push({
            team: window.teamNames[t],
            score: window.teamScores[t]
          });
        }

        // Sort descending by score
        scoresArray.sort((a, b) => b.score - a.score);

        // Populate the leaderboard DOM
        leaderboardList.innerHTML = "";
        scoresArray.forEach((item, index) => {
          const rank = index + 1;
          const leaderboardItem = document.createElement("div");
          leaderboardItem.className = `leaderboard-item rank-${rank}`;
          if (rank === 1) {
            leaderboardItem.classList.add("rank-1");
          }

          let rankDisplay = `#${rank}`;
          if (rank === 1) rankDisplay = "🥇";
          else if (rank === 2) rankDisplay = "🥈";
          else if (rank === 3) rankDisplay = "🥉";

          leaderboardItem.innerHTML = `
            <span class="rank-badge">${rankDisplay}</span>
            <span class="rank-team">${item.team}</span>
            <span class="rank-score">${item.score}<span class="score-unit">pts</span></span>
          `;
          leaderboardList.appendChild(leaderboardItem);
        });

        // Determine Winner / Ties
        const maxScore = scoresArray[0].score;
        const winners = scoresArray.filter(item => item.score === maxScore);
        let announcementText = "";

        if (winners.length === 1) {
          announcementText = `🎉 The Winner is Team ${winners[0].team}! 🎉`;
        } else {
          const winnerNames = winners.map(w => w.team).join(", ");
          announcementText = `🎉 It's a Tie! Winners: ${winnerNames} 🎉`;
        }
        winnerAnnouncement.textContent = announcementText;

        // Stop background audio
        if (bgAudio) {
          bgAudio.pause();
        }

        // Play winner audio
        if (!winnerAudio) {
          winnerAudio = new Audio('audio/jeopardy_winner_audio.mp3');
        }
        winnerAudio.currentTime = 0;
        winnerAudio.play().catch(e => console.log("Winner audio play blocked:", e));

        // Show the End Game modal
        endGameBackdrop.classList.add("visible");
      });

      // Setup transitions and listeners
      btnEnterStep1.addEventListener("click", processGroupCount);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          processGroupCount();
        }
      });

      btnNamesBack.addEventListener("click", () => {
        showStep(1);
        setTimeout(() => input.focus(), 50);
      });

      btnNamesStart.addEventListener("click", () => {
        startGame();
      });

      // Pressing enter in custom name inputs starts the game
      namesContainer.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.classList.contains("team-name")) {
          startGame();
        }
      });


      // Time's Up overlay close button click listener
      document.getElementById("btn-times-up-close").addEventListener("click", () => {
        if (secondaryInterval) clearInterval(secondaryInterval);
        document.getElementById("times-up-overlay").classList.remove("visible");
      });

    });
  </script>
</body>

</html>
