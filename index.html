<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intern Reception - Jeopardy Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient background glow elements -->
  <div class="glow-top-right"></div>
  <div class="glow-bottom-left"></div>

  <!-- Decorative line & sparkle on top-left -->
  <div class="decor-line-left">
    <div class="line"></div>
    <div class="sparkle">
      <svg class="sparkle-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0Q12 12 24 12Q12 12 12 24Q12 12 0 12Q12 12 12 0Z" fill="white"/>
      </svg>
    </div>
  </div>

  <!-- Decorative line & sparkle on bottom-right -->
  <div class="decor-line-right">
    <div class="line"></div>
    <div class="sparkle">
      <svg class="sparkle-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0Q12 12 24 12Q12 12 12 24Q12 12 0 12Q12 12 12 0Z" fill="white"/>
      </svg>
    </div>
  </div>

  <!-- Central Content Area -->
  <main class="container">
    <header>
      <p class="subtitle">Intern Reception</p>
    </header>
    
    <div class="title-group">
      <h1 class="title-main">Jeopardy</h1>
      <h2 class="title-sub">Quiz</h2>
    </div>

    <div class="button-container">
      <a href="rules.html" class="btn btn-rules" id="btn-rules">Rules</a>
      <a href="quiz.html" class="btn btn-start" id="btn-start">Start Game</a>
    </div>
  </main>

</body>
</html>
